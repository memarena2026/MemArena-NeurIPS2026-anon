[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memarena"
version = "1.0.0"
description = "MemArena: an egocentric, permission-aware memory benchmark for LLM personal assistants."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Anonymous Authors", email = "anonymous@example.com" },
]
keywords = [
    "benchmark",
    "llm",
    "memory",
    "dataset",
    "personal-assistant",
    "neurips",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "numpy>=1.26",
    "pandas>=2.1",
    "openai>=1.40",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "jsonschema>=4.21",
    "networkx>=3.2",
    "rich>=13.7",
    "huggingface_hub>=0.23",
    "aiohttp>=3.9",
    "rank-bm25>=0.2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]
inference = [
    "torch>=2.1",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
]
judge = [
    "anthropic>=0.30",
]

[project.urls]
Homepage = "https://example.com/anonymous/MemArena"
Repository = "https://example.com/anonymous/MemArena"
"Dataset (Hugging Face)" = "https://huggingface.co/datasets/zthsecondantigravity/memarena-l"

[project.scripts]
memarena-download = "scripts.download_dataset:main"
memarena-accuracy = "scripts.run_accuracy:main"
memarena-llmjudge = "scripts.llmjudge:main"
memarena-latency  = "scripts.run_latency:main"
memarena-masim    = "scripts.run_masim:main"
memarena-figures  = "scripts.reproduce_figures:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["MASim*", "eval*", "memarena*", "scripts*"]
exclude = ["tests*", "docs*", "config*"]

[tool.setuptools.package-data]
"MASim" = ["configs/**/*.yaml", "configs/**/*.json", "evaluation/rubrics/*.txt", "prompts/*.txt"]
"memarena.human_calibration" = ["*.html"]
